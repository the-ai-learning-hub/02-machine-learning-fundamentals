[project]
name = "machine-learning-fundamentals"
version = "0.1.0"
description = "Lesson 02 of The AI Learning Hub: Machine Learning fundamentals (CRISP-DM, supervised, unsupervised, neural networks, reinforcement learning)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "torch>=2.3",
]

[dependency-groups]
dev = [
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.0",
]

# PyTorch CPU by default (small download on every OS). For an NVIDIA GPU see README → "GPU (opcional)".
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]
